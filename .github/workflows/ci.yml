# Portão automático do repositório (item D0 da Fase D — ver docs/ROADMAP.md).
#
# Antes disto, a suíte passava mas só rodava quando alguém lembrava, e nada
# barrava um PR que a quebrasse. Três jobs, três perguntas distintas:
#
#   backend     — o comportamento continua correto?
#   migrations  — o esquema de produção ainda pode ser construído do zero?
#   frontend    — o que vai ao navegador ainda compila?
#
# O job `migrations` existe porque a suíte NÃO exercita as migrations: o
# conftest monta o banco com `Base.metadata.create_all` sobre SQLite em
# memória. Produção é construída por `alembic upgrade head` sobre Postgres.
# São dois caminhos diferentes, e só um tinha verificação.

name: CI

on:
  push:
    branches: [master]
  pull_request:

# Um push novo na mesma branch cancela a execução anterior — o que interessa
# é o veredicto sobre o commit mais recente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — suíte
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # A suíte roda em SQLite, que é rápido e basta para quase tudo. O Postgres
    # existe por causa da RLS: a política é **inerte** no SQLite, e os testes de
    # isolamento de `test_rls_postgres.py` pulam sem ele. Verde no SQLite não
    # prova nada — ver o item D1 no roadmap.
    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: atlas_user
          POSTGRES_PASSWORD: atlas_password
          POSTGRES_DB: atlas_rls
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas_user -d atlas_rls"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar a suíte
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests/ -q | tee pytest-output.txt

      - name: Rodar os testes de RLS contra Postgres
        # Módulo próprio, com DATABASE_URL apontando para o serviço acima. Sem
        # este passo os seis testes de isolamento pulariam para sempre, e a
        # política voltaria a existir sem defender nada.
        env:
          DATABASE_URL: postgresql+psycopg2://atlas_user:atlas_password@localhost:5432/atlas_rls
        shell: bash
        run: |
          set -o pipefail
          python -m alembic upgrade head
          python -m pytest tests/test_rls_postgres.py -q --no-header -p no:cacheprovider             | tee rls-output.txt
          grep -q "skipped" rls-output.txt             && { echo "::error::Os testes de RLS pularam — Postgres não foi usado."; exit 1; }             || true

      - name: Registrar a contagem
        if: always()
        shell: bash
        run: |
          {
            echo "### Suíte de backend"
            echo ""
            echo '```'
            tail -1 pytest-output.txt 2>/dev/null || echo "sem saída — a suíte não chegou a rodar"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  migrations:
    name: Migrations — construção e reversão em Postgres
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        # Mesma imagem do docker-compose.yml, para que a CI verifique o que
        # o desenvolvimento usa. PostGIS ainda não é exigido por nenhuma
        # migration, mas o §3.6 vai pedir geometria e a paridade sai de graça.
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: atlas_user
          POSTGRES_PASSWORD: atlas_password
          POSTGRES_DB: atlas_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas_user -d atlas_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg2://atlas_user:atlas_password@localhost:5432/atlas_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Construir o esquema do zero
        run: python -m alembic upgrade head

      - name: Verificar que modelos e migrations não divergiram
        # Sem isto, os dois caminhos de construção do esquema — `create_all` a
        # partir dos modelos, que a suíte usa, e `alembic upgrade head`, que
        # produção usa — voltam a se afastar em silêncio. Cada migration nova
        # aumentaria a distância.
        run: python -m alembic check

      - name: Verificar que as migrations são reversíveis
        # Uma migration que não desce é uma migration que não se corrige em
        # produção sem intervenção manual.
        run: python -m alembic downgrade base

      - name: Reconstruir, para provar que o ciclo fecha
        run: python -m alembic upgrade head

  backup:
    name: Backup — ciclo de restauração
    runs-on: ubuntu-latest

    # "Backup não restaurado é hipótese, não cópia." Este job povoa um banco,
    # tira o backup, **destrói o banco** e restaura, comparando a contagem de
    # cada tabela. É a única forma de a restauração ser exercitada sem depender
    # de alguém lembrar — que é como backups deixam de funcionar.
    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: atlas_user
          POSTGRES_PASSWORD: atlas_password
          POSTGRES_DB: atlas_backup_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas_user -d atlas_backup_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg2://atlas_user:atlas_password@localhost:5432/atlas_backup_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: pip install -r backend/requirements.txt

      - name: Exercitar backup, destruição e restauração
        run: python ops/verify_restore.py

  integracao:
    name: Integração — S3 e clamd de verdade
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Item D6. A suíte já cobria o **contrato** de `S3Storage` e do
    # `ClamAVScanner` — com dublê de socket e sem servidor. O que só um serviço
    # real responde ficava sem verificação: se a chave gravada é a chave lida,
    # se objeto inexistente vira `ObjectNotFound` em vez de erro do boto3, e se
    # o clamd de fato reconhece o EICAR.
    #
    # Job separado de propósito: o clamd carrega assinaturas na partida e leva
    # minutos: prendê-lo à suíte principal tornaria lenta a resposta que mais
    # se espera.
    services:
      minio:
        # `bitnami/minio` sobe o servidor sem precisar de `command`, que os
        # serviços do Actions não permitem sobrescrever, e cria o bucket pela
        # variável abaixo.
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: atlas_minio
          MINIO_ROOT_PASSWORD: atlas_minio_secret
          MINIO_DEFAULT_BUCKETS: atlas-integracao
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

      clamav:
        image: clamav/clamav:latest
        ports:
          - 3310:3310
        options: >-
          --health-cmd "clamdcheck.sh"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 30
          --health-start-period 120s

    env:
      S3_ENDPOINT_URL: http://localhost:9000
      S3_BUCKET: atlas-integracao
      S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: atlas_minio
      AWS_SECRET_ACCESS_KEY: atlas_minio_secret
      ANTIVIRUS_BACKEND: clamav
      ANTIVIRUS_HOST: 127.0.0.1
      ANTIVIRUS_PORT: "3310"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Exercitar S3 e clamd
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests/test_storage_s3_integration.py                            tests/test_antivirus_clamd_integration.py                            -q --no-header -p no:cacheprovider | tee integracao.txt
          grep -q "skipped" integracao.txt             && { echo "::error::Os testes de integração pularam — os serviços não foram usados."; exit 1; }             || true

  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Testes
        # O contrato do cliente HTTP (I13). Sem isto, o build é o único portão
        # — e `catch { return [] }` compila.
        run: npm test

      - name: Build
        # Pega erro de TypeScript e de importação; comportamento é com os
        # testes acima.
        run: npm run build
